<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="课题分离卡">
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
<title>课题分离卡</title>
<style>
  /* 布局：单屏抽卡台。顶部一行卡名，中间一张书签比例的卡（身后叠着牌堆），底部一个按钮和剩余张数 */
  :root {
    --bg: #f8eff2;
    --paper: #fffbfc;
    --ink: #3b2a31;
    --muted: #9c8790;
    --accent: #c2577a;
    --accent-soft: #fbe5ec;
    --line: #eedce2;
    --shadow: rgba(122, 52, 78, .2);
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --w: min(76vw, 300px, calc((100vh - 250px) * .625));
  }
  /* iPhone Safari 的 100vh 会把工具栏后面的区域也算进去，卡片会偏大、压住底部按钮；改用可见区域高度 svh */
  @supports (height: 100svh) {
    :root {
      --w: min(76vw, 300px, calc((100svh - 215px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * .625));
    }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1216; --paper: #261a20; --ink: #f1e4e9; --muted: #a8939c;
      --accent: #f1a5be; --accent-soft: #3a222c; --line: #3a2a31; --shadow: rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1216; --paper: #261a20; --ink: #f1e4e9; --muted: #a8939c;
    --accent: #f1a5be; --accent-soft: #3a222c; --line: #3a2a31; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
  button { font: inherit; color: inherit; }

  .app {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding-block: 22px 26px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { text-align: center; display: grid; gap: 6px; }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: .32em;
    padding-left: .32em;
    color: var(--accent);
  }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; }
  .tab {
    border: 0;
    background: none;
    padding: 3px 11px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: .16em;
    color: var(--muted);
    cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .stage {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: grid;
    place-items: center;
    perspective: 1400px;
  }
  .stage > * { grid-area: 1 / 1; }

  .pile { width: var(--w); aspect-ratio: 5 / 8; max-width: 100%; position: relative; }
  .pile::before, .pile::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .pile::before { transform: rotate(-4deg) translate(-6px, 6px); opacity: .7; }
  .pile::after { transform: rotate(2.5deg) translate(5px, 4px); opacity: .85; }
  .pile[hidden] { display: none !important; }

  .slot { width: var(--w); aspect-ratio: 5 / 8; max-width: 100%; }
  .slot.out { opacity: 0; transform: translateY(-18px) scale(.97); transition: opacity .25s ease, transform .25s ease; }
  .slot.deal { animation: deal .5s cubic-bezier(.2, .7, .2, 1); }
  @keyframes deal {
    from { opacity: 0; transform: translateY(30px) rotate(2deg); }
    to { opacity: 1; transform: none; }
  }

  .card {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    position: relative;
    text-align: left;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .7, .2, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card.instant { transition: none; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 8px; }

  .face {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border-radius: 6px;
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 1px 2px var(--shadow), 0 18px 36px -18px var(--shadow);
  }
  .front { background: var(--paper); border: 1px solid var(--line); }
  .back { background: var(--accent-soft); transform: rotateY(180deg); }

  .tag {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: .24em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .back .tag { color: var(--accent); opacity: .75; }

  .text {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(19px, 5.4vw, 23px);
    line-height: 1.8;
    letter-spacing: .04em;
    color: var(--ink);
    text-wrap: balance;
  }
  .back .text { color: var(--accent); font-weight: 400; }

  .src { font-size: 12px; letter-spacing: .12em; color: var(--accent); opacity: .8; padding-bottom: 12px; }
  .src::before { content: "—— "; }
  .src[hidden], .note[hidden] { display: none !important; }
  .note {
    font-size: 12.5px;
    line-height: 1.75;
    letter-spacing: .04em;
    color: var(--ink);
    opacity: .72;
    padding-bottom: 14px;
    padding-right: 4px;
  }
  .back.has-note .text { font-size: clamp(17px, 4.8vw, 21px); line-height: 1.7; }
  .hint { font-size: 12px; letter-spacing: .1em; color: var(--muted); }

  /* 牌背：竖排的一句话，像书签 */
  .cover {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 22px 0 16px;
  }
  .cover[hidden], .q[hidden] { display: none !important; }
  .cover-title {
    writing-mode: vertical-rl;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(24px, 7vw, 30px);
    letter-spacing: .3em;
    color: var(--accent);
  }
  .cover-foot { font-size: 11px; letter-spacing: .3em; color: var(--muted); }
  .q { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  footer { display: grid; justify-items: center; gap: 10px; position: relative; z-index: 2; }
  .btn {
    border: 0;
    border-radius: 999px;
    padding: 12px 40px;
    background: var(--accent);
    color: var(--paper);
    font-size: 15px;
    letter-spacing: .16em;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn:active { transform: scale(.98); }
  .count {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0 10px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .08em;
    font-variant-numeric: tabular-nums;
  }
  .link[hidden], .skip[hidden] { display: none !important; }
  .slot { position: relative; }
  .skip {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 3;
    border: 0;
    background: none;
    padding: 8px 10px;
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line);
    cursor: pointer;
  }
  .skip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .link {
    border: 0;
    background: none;
    padding: 0 2px;
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line);
    cursor: pointer;
  }
  .link.accent { color: var(--accent); text-decoration-color: currentColor; }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .card, .slot.out { transition: none; }
    .slot.deal { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>课题分离卡</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="选择牌堆"></nav>
  </header>

  <main class="stage">
    <div class="pile" id="pile" aria-hidden="true"></div>
    <div class="slot" id="slot">
      <button class="card" id="card" type="button" aria-label="牌堆，点一下抽一张">
        <div class="face front">
          <div class="cover" id="cover">
            <div class="cover-title">这是谁的课题</div>
            <div class="cover-foot" id="coverFoot">点一下抽卡</div>
          </div>
          <div class="q" id="q" hidden>
            <div class="tag"><span>问</span><span id="noFront"></span></div>
            <div class="text" id="qText"></div>
            <div class="hint">点卡片翻面</div>
          </div>
        </div>
        <div class="face back">
          <div class="tag"><span>带走</span><span id="noBack"></span></div>
          <div class="text" id="aText"></div>
          <div class="src" id="src" hidden></div>
          <div class="note" id="note" hidden></div>
          <div class="hint">点一下翻回去</div>
        </div>
      </button>
      <button class="skip" id="skip" type="button" hidden>不想再抽到</button>
    </div>
  </main>

  <footer>
    <button class="btn" id="next" type="button">抽一张</button>
    <p class="count"><span id="count"></span><button class="link accent" id="undo" type="button" hidden>撤销</button><button class="link" id="restore" type="button" hidden></button></p>
  </footer>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
  const CARDS = [
    ["如果没有人认可，我还想做这件事吗？", "我做这件事，是因为我想，不是因为有人在看。"],
    ["别人的失望，对我来说意味着什么？", "别人的失望是对方的期待落空，不是我的失败。"],
    ["我现在做的，是我想做的，还是别人期待我做的？", "期待是别人出的题，答不答由我决定。"],
    ["我害怕被讨厌，怕的是讨厌本身吗？", "别人的讨厌是对方心里的天气，不是我身上的污渍。"],
    ["我对一个人好，是想对他好，还是想他也这样对我？", "不等回音的好，才是我送出去的礼物。"],
    ["我不补位，后果会落在谁身上？", "我不再替别人收拾他们留下的窟窿。"],
    ["对方站上道德高地时，我需要爬上去争吗？", "高地是对方搭的台子，事实是大家都踩着的地。"],
    ["这件事搞砸了，最终是谁承担后果？", "谁承担后果，就是谁的课题。"],
    ["我在等一个人改变，对方真的会变吗？", "我不再把我的心情，押在别人的改变上。"],
    ["我反复想“对方怎么敢”，是在替谁做题？", "掂不掂量是对方的事，我回应过就够了。"],
    ["我拒绝之后对方不高兴，那是谁的课题？", "我可以拒绝，对方可以不高兴，我们都没有错。"],
    ["我在解释，是为了说清楚，还是为了被原谅？", "说清楚一次就够了，理不理解交给对方。"],
    ["我生气，是想让对方怎样？", "我的火是我的，我不把它交到别人手里。"],
    ["我一直不做决定，是在回避什么？", "不做决定也是一种决定，只是我不想承认。"],
    ["我决定了却迟迟不做，是在保护什么？", "不开始就不会失败，可也什么都不会发生。"],
    ["我拿自己跟别人比，是在找答案，还是在找安慰？", "比别人好，不等于够好。够不够好，只有我能定。"],
    ["一句话扎到我，是因为它对，还是因为我也半信？", "扎到我的，往往是我自己也没放下的那句。"],
    ["如果别人怎么看我都不重要了，我会做什么？", "我不必活在别人的眼睛里。"],
    ["我在照顾别人的情绪，谁在照顾我的？", "别人的情绪由对方负责，我先顾好我自己。"],
    ["对方说我不好，是在描述我，还是在描述自己？", "一个人怎么评价别人，暴露的常常是他自己。"],
    ["我埋怨自己，这份埋怨在帮我做什么？", "不必为别人的毛病，再罚自己一遍。"],
    ["我想证明自己，是要证明给谁看？", "我不需要向所有人交代我是谁。"],
    ["我道歉，是因为我错了，还是因为气氛需要？", "我只为自己的错道歉，不为别人的不满买单。"],
    ["被冒犯的那一刻，我能管住的是什么？", "我管不住别人的嘴，管得住我的回应。"],
    ["这段关系让我累，我是在扛谁的那一份？", "我只扛属于我的那一半。"],
    ["我想出一口气，出完之后谁来买单？", "痛快是一时的，账单是我的。"],
    ["如果对方永远不理解我，我还要继续解释吗？", "被理解是礼物，不是我必须拿到的东西。"],
    ["我替别人着急，对方自己急吗？", "别人的人生，我不替他焦虑。"],
    ["我在讨好的那个人，真的在乎我做了什么吗？", "讨好换不来尊重，只会换来更多期待。"],
    ["今天，我替谁做了题？", "把别人的题还回去，我才有力气写自己的。"],
    ["这件事里，哪些在我手里，哪些不在？", "在我手里的，我尽力。不在的，我放手。", "爱比克泰德 · 控制二分法"],
    ["让我难受的，是这件事本身，还是我对它下的判断？", "扰乱我的，往往不是事情，是我给事情下的判断。", "爱比克泰德"],
    ["我已经中了一箭，还要自己再补第二箭吗？", "第一箭是发生的事，第二箭是我一遍遍的回想。", "佛经 · 箭喻"],
    ["我确定我知道对方心里在想什么吗？", "我不是鱼，也不是他。猜来的心思，不能当成事实。", "庄子 · 濠梁之辩"],
    ["如果这样的日子要重过一万遍，我还愿意吗？", "选一种我愿意一遍遍重来的活法。", "尼采 · 永恒轮回"],
    ["石头推上去还会滚下来，我还能在里面找到自己的意思吗？", "意义不在山顶，在我推石头的那双手里。", "加缪 · 西西弗斯"],
    ["我说“我没得选”，是真的没有，还是不想为选择负责？", "不选也是一种选。我一直在为自己的人生作答。", "萨特 · 人注定是自由的"],
    ["今天的我，和昨天为这件事难过的我，还是同一个人吗？", "人不能两次踏进同一条河。我在变，事也在变。", "赫拉克利特"],
    ["我想看懂别人，那我看懂自己了吗？", "知人者智，自知者明。", "老子 · 道德经", "能看懂别人是聪明，能看懂自己才是真正的明白。"],
    ["我担心的事，有多少真的发生了，有多少只发生在我脑子里？", "人在想象里受的苦，比在现实里多。", "塞涅卡"],

    ["我的心情，是不是总跟着外面的事起起落落？", "不以物喜，不以己悲。", "范仲淹 · 岳阳楼记", "不因为外物的好坏而高兴，也不因为自己的得失而悲伤。"],
    ["风雨打在身上的时候，我一定要停下来躲吗？", "莫听穿林打叶声，何妨吟啸且徐行。", "苏轼 · 定风波", "别去听雨打树叶的声音，不妨一边吟唱一边慢慢走。苏轼写这首词时，正被贬在黄州。"],
    ["回头看那些让我难受的事，它们现在还有那么大吗？", "回首向来萧瑟处，归去，也无风雨也无晴。", "苏轼 · 定风波", "回头看刚才风雨交加的地方，回去吧。那里其实没有风雨，也没有晴天。"],
    ["路走到头了，我能不能先坐下来看看？", "行到水穷处，坐看云起时。", "王维 · 终南别业", "走到水流的尽头，就坐下来看云升起。路断了，换个看法，风景还在。"],
    ["没人懂我、没人夸我，我会因此生气吗？", "人不知而不愠，不亦君子乎？", "论语 · 学而", "别人不了解我，我也不恼怒，这不就是君子吗？"],

    ["我想赢的，是别人，还是自己？", "胜人者有力，自胜者强。", "老子 · 道德经", "能胜过别人的人有力量，能战胜自己的人才是真正的强大。"],
    ["我一定要争个高下吗？", "上善若水，水善利万物而不争。", "老子 · 道德经", "最高的善像水一样，滋养万物，却不与万物相争。"],
    ["周围很吵的时候，我的心能不能离远一点？", "问君何能尔？心远地自偏。", "陶渊明 · 饮酒", "问我住在喧闹人间，怎么还听不到车马声？心离得远了，所在的地方自然就清静了。"],
    ["全世界都夸我、都骂我，我会变成另一个人吗？", "举世誉之而不加劝，举世非之而不加沮。", "庄子 · 逍遥游", "全世界都夸他，他也不会因此更起劲；全世界都骂他，他也不会因此沮丧。庄子说的是宋荣子。"],
    ["事情过去了，我还把它留在心里吗？", "至人之用心若镜，不将不迎，应而不藏。", "庄子 · 应帝王", "修养最高的人，心像一面镜子：东西来了不迎，走了不送，照见了也不留下。"],
    ["别人泼过来的脏水，真的能沾到我身上吗？", "本来无一物，何处惹尘埃。", "慧能", "心本来空无一物，又能从哪里沾上尘埃呢？出自六祖慧能的偈子。"],
    ["我的心，是不是被某件事、某个人钉住了？", "应无所住而生其心。", "金刚经", "心不粘在任何一件事、一个人上，这样生出来的心才是自在的。"],
    ["如果没有闲事挂在心上，今天会是什么样子？", "春有百花秋有月，夏有凉风冬有雪。若无闲事挂心头，便是人间好时节。", "无门慧开", "每个季节都有它的好。只要心里不挂着闲事，哪一天都是好时节。"],
    ["让我过不去的，是外面那个人，还是我心里那个念头？", "破山中贼易，破心中贼难。", "王阳明", "剿灭山里的盗贼容易，去掉自己心里的杂念难。王阳明在南赣剿匪时写信给学生说的。"],
    ["别人看不上我的时候，我还看得上自己吗？", "天生我材必有用。", "李白 · 将进酒", "老天生下我这样的人，必定有我的用处。"],
    ["我想报复一个人，是不是正在变成他？", "最好的报复，是不要变成和对方一样的人。", "马可·奥勒留 · 沉思录"],
    ["赢了我会飘吗？输了我会塌吗？", "如果你能面对成功与灾难，并把这两个骗子一视同仁。", "吉卜林 · 如果 · 温网中央球场入口"],
    ["那件差点把我打垮的事，最后给我留下了什么？", "那些杀不死我的，会让我更强大。", "尼采"],
    ["我上一次认真看看自己，是什么时候？", "未经审视的人生，不值得过。", "苏格拉底"],
    ["面对一个让我气炸的人，我能先试着理解，而不是评判吗？", "不要哭，不要笑，不要诅咒，而要理解。", "斯宾诺莎"],
    ["有些问题现在没有答案，我等得起吗？", "对心里所有未解的问题保持耐心，试着去爱问题本身。", "里尔克 · 给青年诗人的信"],
    ["我对自己那么确定的看法，真的确定吗？", "我知道什么？", "蒙田"],
    ["发生在我身上的事，我给了它什么意义？", "决定我们的不是经历本身，而是我们赋予经历的意义。", "阿德勒"],
    ["我反复遇到同样的事，会不会跟我自己的选择有关？", "性格即命运。", "赫拉克利特"],
    ["我能做自己情绪的主人吗？", "不能主宰自己的人，就不是自由的。", "爱比克泰德"],
    ["我的光，是不是总等着别人来点？", "心灯不借他人火。", "在冰箱贴上看到的一句", "心里那盏灯，不用借别人的火来点。"],
    ["今天我的心静吗？", "愿我六根常寂静，心如宝月映琉璃。", "在冰箱贴上看到的另一句", "六根是眼、耳、鼻、舌、身、意。愿它们不被外物搅乱，心像明月映在琉璃里一样清澈。"],
    ["这件事，我还撑得住吗？", "胜利属于意志最坚韧之人。", "罗兰·加洛斯 · 法网中央球场"],
    ["坏事发生的时候，我能确定它一定是坏事吗？", "塞翁失马，焉知非福。", "典出《淮南子 · 人间训》", "边塞老人丢了马，谁知道不是福气呢。好坏常常要过一阵子才看得清。"],
    ["我心里定下来了吗，还是一直在晃？", "知止而后有定，定而后能静，静而后能安。", "大学", "知道自己该停在哪里，心才能定；定了才能静，静了才能安。"],
    ["今天，我有没有回头看看自己？", "吾日三省吾身。", "论语 · 学而", "曾子说：我每天多次反省自己。"],
    ["难的时候，我看清了身边哪些人、哪些事？", "岁寒，然后知松柏之后凋也。", "论语 · 子罕", "到了一年最冷的时候，才知道松柏是最后凋零的。困境最能看清人。"],
    ["那件让我放不下的事，还停在原地吗？", "逝者如斯夫，不舍昼夜。", "论语 · 子罕", "孔子站在河边说：流逝的一切就像这河水，日夜不停。"],
    ["我现在是困惑、是忧虑，还是害怕？", "知者不惑，仁者不忧，勇者不惧。", "论语 · 子罕", "明白的人不困惑，仁厚的人不忧愁，勇敢的人不畏惧。看看自己缺的是哪一样。"],
    ["这件坏事里，有没有藏着一点好？", "祸兮福之所倚，福兮祸之所伏。", "老子 · 道德经", "灾祸里倚着福气，福气里伏着灾祸，两者常常互相转化。"],
    ["如果我不争，真的会失去什么吗？", "夫唯不争，故天下莫能与之争。", "老子 · 道德经", "正因为不去争，天下就没有谁能和他争。"],
    ["我真正需要的，到底有多少？", "鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹。", "庄子 · 逍遥游", "小鸟在深林里筑巢，只占一根树枝；鼹鼠到河边喝水，喝饱肚子就够了。"],
    ["有些关系，是不是放手比硬撑更好？", "相濡以沫，不如相忘于江湖。", "庄子 · 大宗师", "泉水干了，鱼困在地上互相吐沫润湿对方，不如回到江湖里，各自游，彼此相忘。"],
    ["我和这个人的交情，是浓，还是长？", "君子之交淡若水，小人之交甘若醴。", "庄子 · 山木", "君子之间的交往像水一样淡，小人之间的交往像甜酒一样浓。淡的长久，甜的易断。"],
    ["我是不是把路过的地方，当成了要待一辈子的地方？", "人生如逆旅，我亦是行人。", "苏轼 · 临江仙", "人生就像一间旅店，我也只是路过的客人。逆旅就是旅店。"],
    ["让我安心的，是一个地方，还是一种状态？", "此心安处是吾乡。", "苏轼 · 定风波", "心能安下来的地方，就是我的家乡。苏轼是借一位歌女的话写的。"],
    ["最近让我开心的，是热闹，还是清淡？", "人间有味是清欢。", "苏轼 · 浣溪沙", "人间真正有滋味的，是清淡的欢喜。"],
    ["现在的难，会一直这样下去吗？", "长风破浪会有时，直挂云帆济沧海。", "李白 · 行路难", "总有一天能乘着长风破开巨浪，挂起高帆渡过大海。"],
    ["我觉得没路了，是真的没有，还是还没走到那个拐角？", "山重水复疑无路，柳暗花明又一村。", "陆游 · 游山西村", "山一重水一重，以为没路了；转过去柳色深、花色明，又是一个村子。"],
    ["让我看不清的，是眼前的浮云，还是我站的位置？", "不畏浮云遮望眼，自缘身在最高层。", "王安石 · 登飞来峰", "不怕浮云遮住视线，因为自己站在最高处。站得高，眼前的小事就挡不住你。"],
    ["被反复打击之后，我还立得住吗？", "千磨万击还坚劲，任尔东西南北风。", "郑燮 · 竹石", "经过千万次磨打，竹子依然坚韧挺拔，随便东南西北哪里吹来的风。"],
    ["我知道该怎么做了，那我做了吗？", "知是行之始，行是知之成。", "王阳明 · 传习录", "知道是行动的开始，行动是知道的完成。知道了却不做，等于还没真正知道。"],
    ["我心里静得下来吗？", "非淡泊无以明志，非宁静无以致远。", "诸葛亮 · 诫子书", "不看淡名利，就看不清自己的志向；心不宁静，就走不了远路。"],
    ["我还在为过去的事懊悔吗？", "悟已往之不谏，知来者之可追。", "陶渊明 · 归去来兮辞", "明白过去的已经无法挽回，也知道未来的还来得及追。"],
    ["我是不是太在意贫富得失了？", "不戚戚于贫贱，不汲汲于富贵。", "陶渊明 · 五柳先生传", "不为贫贱而忧愁，也不为富贵而急着去追。"],
    ["我在找一个特别的答案，它会不会就在日常里？", "平常心是道。", "马祖道一", "道不在别处，就在平平常常过日子的那颗心里。"],
    ["今天如果平平无奇，它还算好日子吗？", "日日是好日。", "云门文偃", "不管晴雨顺逆，每一天都是好日子。好坏在心，不在日子。"],
    ["一段结束的关系，有没有留给我一些养分？", "落红不是无情物，化作春泥更护花。", "龚自珍 · 己亥杂诗", "落下的花并不是无情之物，它化成春泥，还在护着花。"],
    ["我是不是太活在别人的眼光里了？", "他人即地狱。", "萨特 · 禁闭", "萨特不是说别人坏，而是说一个人太依赖别人的目光来定义自己，就像活在地狱里。"],
    ["有些话，我是不是不必说出口？", "凡不可说的，应当保持沉默。", "维特根斯坦 · 逻辑哲学论"],
    ["最冷的时候，我心里还剩下什么？", "在隆冬，我终于知道，我身上有一个不可战胜的夏天。", "加缪"],
    ["是事情太难我才不敢，还是我不敢，事情才变难？", "不是因为事情难我们才不敢做，是因为不敢做，事情才变难。", "塞涅卡"],
    ["我觉得自己很渺小的时候，还剩下什么？", "人是一根能思想的苇草。", "帕斯卡 · 思想录"]
  ];

  // 卡片编号就是数组下标：以后加卡只能往末尾追加，不要删改顺序，否则"不想再抽到"的记录会对错卡
  // 新加的卡，记得把编号区间加进下面对应的组（区间左闭右开，从 0 开始数）
  const GROUPS = [
    { key: "all", name: "全部" },
    { key: "issue", name: "课题", ranges: [[0, 30]] },
    { key: "phil", name: "哲学", ranges: [[30, 40]] },
    { key: "motto", name: "箴言", ranges: [[40, 100]] }
  ];
  const DECKS_KEY = "issue-cards-decks-v5";
  const HIDDEN_KEY = "issue-cards-hidden-v1";
  const GROUP_KEY = "issue-cards-group-v1";
  const $ = (id) => document.getElementById(id);
  const card = $("card"), slot = $("slot"), pile = $("pile"), btn = $("next"), count = $("count"), live = $("live");
  const cover = $("cover"), q = $("q"), tabs = $("tabs");
  const skipBtn = $("skip"), undoBtn = $("undo"), restoreBtn = $("restore");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isId = (x) => Number.isInteger(x) && x >= 0 && x < CARDS.length;
  const inGroup = (g, id) => !g.ranges || g.ranges.some(([a, b]) => id >= a && id < b);
  const groupOf = (k) => GROUPS.find((g) => g.key === k) || GROUPS[0];

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let hiddenIds = new Set();
  try {
    const h = JSON.parse(localStorage.getItem(HIDDEN_KEY));
    if (Array.isArray(h)) hiddenIds = new Set(h.filter(isId));
  } catch (e) {}

  const available = (g) => CARDS.map((_, i) => i).filter((i) => inGroup(g, i) && !hiddenIds.has(i));

  // 每副牌各自记进度
  let decks = {};
  try {
    const d = JSON.parse(localStorage.getItem(DECKS_KEY));
    if (d && typeof d === "object") decks = d;
  } catch (e) {}
  GROUPS.forEach((g) => {
    let d = Array.isArray(decks[g.key])
      ? decks[g.key].filter((x) => isId(x) && inGroup(g, x) && !hiddenIds.has(x))
      : [];
    if (d.length === 0) d = shuffle(available(g));
    decks[g.key] = d;
  });

  let cur = "all";
  try {
    const k = localStorage.getItem(GROUP_KEY);
    if (GROUPS.some((g) => g.key === k)) cur = k;
  } catch (e) {}

  const deck = () => decks[cur];
  function save() {
    try { localStorage.setItem(DECKS_KEY, JSON.stringify(decks)); } catch (e) {}
  }
  function saveHidden() {
    try { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenIds])); } catch (e) {}
  }
  function insertRandom(id) {
    GROUPS.forEach((g) => {
      const d = decks[g.key];
      if (inGroup(g, id) && !d.includes(id)) d.splice(Math.floor(Math.random() * (d.length + 1)), 0, id);
    });
  }
  function removeEverywhere(id) {
    GROUPS.forEach((g) => { decks[g.key] = decks[g.key].filter((x) => x !== id); });
  }

  let state = "cover";
  let busy = false;
  let note = "";
  let current = null;
  let undoId = null;
  let restoreArmed = false;
  let restoreTimer = null;

  // 顶部切换
  GROUPS.forEach((g) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.id = "tab-" + g.key;
    b.setAttribute("role", "tab");
    b.textContent = g.name;
    b.addEventListener("click", () => switchGroup(g.key));
    tabs.appendChild(b);
  });

  function fill(id) {
    const [qs, as, src, nt] = CARDS[id];
    $("src").textContent = src || "";
    $("src").hidden = !src;
    $("note").textContent = nt || "";
    $("note").hidden = !nt;
    document.querySelector(".back").classList.toggle("has-note", !!nt);
    const no = "No." + String(id + 1).padStart(2, "0");
    $("qText").textContent = qs;
    $("aText").textContent = as;
    $("noFront").textContent = no;
    $("noBack").textContent = no;
    cover.hidden = true;
    q.hidden = false;
  }

  function showCover() {
    card.classList.add("instant");
    card.classList.remove("flipped");
    void card.offsetWidth;
    card.classList.remove("instant");
    cover.hidden = false;
    q.hidden = true;
    state = "cover";
    current = null;
  }

  function updateUI() {
    const g = groupOf(cur);
    btn.textContent = state === "cover" ? "抽一张" : "再抽一张";
    count.textContent = note || ("这一轮还剩 " + deck().length + " 张");
    pile.hidden = deck().length === 0;
    undoBtn.hidden = undoId === null;
    skipBtn.hidden = state !== "a";
    restoreBtn.hidden = hiddenIds.size === 0;
    if (!restoreArmed) restoreBtn.textContent = "恢复已移出的 " + hiddenIds.size + " 张";
    $("coverFoot").textContent = g.key === "all" ? "点一下抽卡" : g.name + " · 点一下抽卡";
    GROUPS.forEach((x) => $("tab-" + x.key).setAttribute("aria-selected", String(x.key === cur)));
    if (state === "cover") card.setAttribute("aria-label", g.name + "牌堆，点一下抽一张");
    else if (state === "q") card.setAttribute("aria-label", "问：" + $("qText").textContent + "。点一下翻面");
    else card.setAttribute("aria-label", "带走：" + $("aText").textContent + "。点一下翻回去");
  }

  function switchGroup(k) {
    if (busy || k === cur) return;
    cur = k;
    try { localStorage.setItem(GROUP_KEY, k); } catch (e) {}
    undoId = null;
    note = "";
    showCover();
    slot.classList.remove("out", "deal");
    void slot.offsetWidth;
    if (!reduce) slot.classList.add("deal");
    updateUI();
    live.textContent = "已切换到" + groupOf(k).name;
  }

  function draw(msg, keepUndo) {
    if (busy) return;
    note = msg || "";
    if (!keepUndo) undoId = null;
    if (deck().length === 0) {
      const pool = available(groupOf(cur));
      if (pool.length === 0) {
        showCover();
        note = "这副牌都被移出了，点旁边恢复";
        updateUI();
        return;
      }
      decks[cur] = shuffle(pool);
      if (!msg) note = pool.length + " 张都抽完了，已经重新洗牌";
    }
    const id = deck().pop();
    save();
    busy = true;
    const go = () => {
      card.classList.add("instant");
      card.classList.remove("flipped");
      void card.offsetWidth;
      card.classList.remove("instant");
      fill(id);
      current = id;
      state = "q";
      slot.classList.remove("out", "deal");
      void slot.offsetWidth;
      if (!reduce) slot.classList.add("deal");
      updateUI();
      live.textContent = "问：" + CARDS[id][0];
      busy = false;
    };
    if (reduce) go();
    else {
      slot.classList.add("out");
      setTimeout(go, state === "cover" ? 220 : 260);
    }
  }

  function flip() {
    if (busy) return;
    if (state === "q") {
      card.classList.add("flipped");
      state = "a";
      live.textContent = "带走：" + $("aText").textContent;
    } else if (state === "a") {
      card.classList.remove("flipped");
      state = "q";
      live.textContent = "问：" + $("qText").textContent;
    }
    updateUI();
  }

  function skip() {
    if (busy || current === null) return;
    const id = current;
    hiddenIds.add(id);
    saveHidden();
    removeEverywhere(id);
    save();
    undoId = id;
    draw("已移出，不会再抽到", true);
  }

  function undo() {
    if (undoId === null) return;
    hiddenIds.delete(undoId);
    saveHidden();
    insertRandom(undoId);
    save();
    undoId = null;
    note = "已撤销，那张卡放回牌堆了";
    updateUI();
  }

  function restoreAll() {
    if (!restoreArmed) {
      restoreArmed = true;
      restoreBtn.textContent = "再点一次确认恢复";
      clearTimeout(restoreTimer);
      restoreTimer = setTimeout(() => { restoreArmed = false; updateUI(); }, 4000);
      return;
    }
    clearTimeout(restoreTimer);
    restoreArmed = false;
    const back = [...hiddenIds];
    hiddenIds.clear();
    saveHidden();
    back.forEach(insertRandom);
    save();
    undoId = null;
    note = "已恢复 " + back.length + " 张，放回牌堆了";
    updateUI();
  }

  card.addEventListener("click", () => (state === "cover" ? draw() : flip()));
  btn.addEventListener("click", () => draw());
  skipBtn.addEventListener("click", skip);
  undoBtn.addEventListener("click", undo);
  restoreBtn.addEventListener("click", restoreAll);
  updateUI();
</script>

</body>
</html>
